<div class="contact-form-card">
  <div class="form-header text-center">
    <h3 class="fw-bold mb-2">Detaylı Bilgi & Teklif Alın</h3>
    <p class="text-muted">Hizmetlerimiz hakkında daha fazla bilgi almak için aşağıdaki formu doldurun, uzman ekibimiz en kısa sürede size dönüş yapsın.</p>
  </div>
  
  <form class="custom-form mt-4">
    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="nameInput" placeholder="Adınız Soyadınız" required>
          <label for="nameInput">Adınız Soyadınız</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-floating">
          <input type="email" class="form-control" id="emailInput" placeholder="E-posta Adresiniz" required>
          <label for="emailInput">E-posta Adresiniz</label>
        </div>
      </div>
      <div class="col-12">
        <div class="form-floating">
          <input type="tel" class="form-control" id="phoneInput" placeholder="Telefon Numaranız" required>
          <label for="phoneInput">Telefon Numaranız</label>
        </div>
      </div>
      <div class="col-12">
        <div class="form-floating">
          <textarea class="form-control" placeholder="Mesajınız" id="messageInput" style="height: 120px" required></textarea>
          <label for="messageInput">Mesajınız</label>
        </div>
      </div>
      <div class="col-12 mt-4 text-center">
        <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm">
          Gönder <i class="fas fa-paper-plane ms-2"></i>
        </button>
      </div>
    </div>
  </form>
</div>
